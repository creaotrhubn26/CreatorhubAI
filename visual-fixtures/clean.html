<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f7f7fb;
    color: #1a1a1a;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    box-sizing: border-box;
    padding: 24px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 28px;
  }
  p {
    margin: 0;
    max-width: 320px;
    font-size: 16px;
    line-height: 1.5;
    color: #444;
  }
  button {
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Welcome back</h1>
  <p>This is a simple, clean fixture page: readable text, no overlap, and a
     primary button that stays fully visible inside the viewport.</p>
  <button type="button">Get Started</button>
</body>
</html>
