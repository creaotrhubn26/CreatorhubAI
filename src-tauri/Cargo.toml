[package]
name = "glimmer-control-center"
version = "0.2.3"
description = "Glimmer Control Center — desktop shell for the local Glimmer gateway"
authors = ["Creatorhubn"]
edition = "2024"

[lib]
name = "glimmer_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Task 4c(2/3): native Finder directory/file chooser for the task composer's
# workspace and scope-path fields (browser builds fall back to the gateway's
# read-only GET /api/fs/dirs browser).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
