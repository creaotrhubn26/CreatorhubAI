[package]
name = "glimmer-control-center"
version = "0.1.0"
description = "Glimmer Control Center — desktop shell for the local Glimmer gateway"
authors = ["Creatorhubn"]
edition = "2024"

[lib]
name = "glimmer_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
