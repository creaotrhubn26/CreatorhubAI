name: Release Glimmer desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: glimmer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require Apple Silicon runner
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Glimmer releases require an arm64 runner so the bundled Node sidecar matches the app target." >&2
            exit 1
          fi

      - name: Require signing and notarization credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust release target and quality components
        run: |
          rustup target add aarch64-apple-darwin
          rustup component add rustfmt clippy

      - name: Verify release version matches tag
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Prepare bundled runtime
        run: |
          src-tauri/scripts/prepare-sidecar.sh
          src-tauri/scripts/prepare-gateway.sh
          npm run runtime:prepare

      - name: Sign bundled Python native libraries
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run runtime:sign

      - name: Verify bundled runtime
        run: npm run runtime:verify

      - name: Run quality gates
        run: npm run quality

      - name: Materialize App Store Connect API key
        id: apple-api-key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
          echo "path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed and notarized draft release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple-api-key.outputs.path }}
        with:
          tagName: v__VERSION__
          releaseName: Glimmer Control Center v__VERSION__
          releaseBody: Signed and notarized Apple Silicon build with cryptographically verified automatic updates.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 3
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Verify notarization and updater signature
        run: |
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="${bundle_dir}/macos/Glimmer Control Center.app"
          updater_archive=$(find "${bundle_dir}" -name '*.app.tar.gz' -print -quit)
          test -d "${app_path}"
          test -n "${updater_archive}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          src-tauri/scripts/verify-python-signatures.sh \
            "${app_path}/Contents/Resources/binaries/runtime/python"
          xcrun stapler validate "${app_path}"
          spctl -a -vvv -t install "${app_path}"
          npm run release:verify -- "${updater_archive}"

      - name: Create isolated release-gate worktree
        run: |
          e2e_workspace="${RUNNER_TEMP}/glimmer-release-worktree"
          git worktree add -b "glimmer/release-e2e-${GITHUB_RUN_ID}" "${e2e_workspace}" HEAD
          echo "E2E_WORKSPACE=${e2e_workspace}" >> "${GITHUB_ENV}"

      - name: Exercise the built frontend with Playwright
        run: |
          ui_state="${RUNNER_TEMP}/glimmer-ui-state"
          mkdir -p "${ui_state}"
          GLIMMER_STATE_ROOT="${ui_state}" \
          GLIMMER_V2_PATH="${GITHUB_WORKSPACE}/scripts/fixtures/glimmer-v2-e2e.mjs" \
          GLIMMER_INSTANCE_ID="release-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          GLIMMER_UI_ORIGIN="http://127.0.0.1:5184" \
          GLIMMER_MODEL_URL="http://127.0.0.1:1" \
          node server/dist/index.js > "${RUNNER_TEMP}/ui-gateway.log" 2>&1 &
          gateway_pid=$!
          npm --prefix web run preview -- --host 127.0.0.1 --port 5184 \
            > "${RUNNER_TEMP}/ui-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "${preview_pid}" "${gateway_pid}" 2>/dev/null || true
            wait "${preview_pid}" "${gateway_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm run packaged:ui-e2e -- \
            --workspace="${E2E_WORKSPACE}" \
            --app="http://127.0.0.1:5184" \
            --instance="release-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup
          trap - EXIT

      - name: Exercise the signed native app and bundled gateway
        run: |
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Glimmer Control Center.app"
          app_binary="${app_path}/Contents/MacOS/glimmer-control-center"
          native_state="${RUNNER_TEMP}/glimmer-native-state"
          native_instance="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          native_capability="release-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${native_state}"
          GLIMMER_STATE_ROOT="${native_state}" \
          GLIMMER_V2_PATH="${GITHUB_WORKSPACE}/scripts/fixtures/glimmer-v2-e2e.mjs" \
          GLIMMER_INSTANCE_ID="${native_instance}" \
          GLIMMER_CAPABILITY_TOKEN="${native_capability}" \
          GLIMMER_MODEL_URL="http://127.0.0.1:1" \
          "${app_binary}" > "${RUNNER_TEMP}/native-app.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "${app_pid}" 2>/dev/null || true
            wait "${app_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm run packaged:e2e -- \
            --workspace="${E2E_WORKSPACE}" \
            --instance="${native_instance}" \
            --capability="${native_capability}"
          cleanup
          trap - EXIT

      - name: Verify Force Quit recovery in the signed native app
        run: |
          app_binary="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Glimmer Control Center.app/Contents/MacOS/glimmer-control-center"
          npm run packaged:force-quit-e2e -- \
            --app="${app_binary}" \
            --workspace="${E2E_WORKSPACE}" \
            --state="${RUNNER_TEMP}/glimmer-force-quit-state" \
            --fixture="${GITHUB_WORKSPACE}/scripts/fixtures/glimmer-v2-e2e.mjs"
