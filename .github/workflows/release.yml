name: Release Glimmer desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: glimmer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require Apple Silicon runner
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Glimmer releases require an arm64 runner so the bundled Node sidecar matches the app target." >&2
            exit 1
          fi

      - name: Require signing and notarization credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust release target and quality components
        run: |
          rustup target add aarch64-apple-darwin
          rustup component add rustfmt clippy

      - name: Verify release version matches tag
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Prepare bundled runtime
        run: |
          src-tauri/scripts/prepare-sidecar.sh
          src-tauri/scripts/prepare-gateway.sh

      - name: Run quality gates
        run: npm run quality

      - name: Materialize App Store Connect API key
        id: apple-api-key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
          echo "path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed and notarized draft release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple-api-key.outputs.path }}
        with:
          tagName: v__VERSION__
          releaseName: Glimmer Control Center v__VERSION__
          releaseBody: Signed and notarized Apple Silicon build with cryptographically verified automatic updates.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 3
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Verify notarization and updater signature
        run: |
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="${bundle_dir}/macos/Glimmer Control Center.app"
          updater_archive=$(find "${bundle_dir}" -name '*.app.tar.gz' -print -quit)
          test -d "${app_path}"
          test -n "${updater_archive}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl -a -vvv -t install "${app_path}"
          npm run release:verify -- "${updater_archive}"
