name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Prepare Tauri build resources
        run: |
          src-tauri/scripts/prepare-sidecar.sh
          src-tauri/scripts/prepare-gateway.sh
          npm run runtime:prepare

      - name: Verify bundled runtime
        run: npm run runtime:verify

      - name: Run quality gates
        run: npm run quality
